name: Build & test

# Runs on every push and pull request:
#  1. automated tests
#  2. website build (published to GitHub Pages from the main branch)
#  3. Android build (.apk to install directly on a phone, + signed .aab for Google Play when signing secrets exist)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2
  GODOT_URL: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable

permissions:
  contents: read

# Only the newest push on a branch keeps building (avoids two runs publishing at once).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Godot
        run: |
          curl -sSL -o godot.zip "$GODOT_URL/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
      - name: Import project
        run: godot --headless --path . --import || true
      - name: Run tests
        run: godot --headless --path . --script res://tests/run_tests.gd
      - name: Run end-to-end flow test
        run: timeout 120 godot --headless --path . res://tests/flow_test.tscn
      - name: Check the app starts without errors
        run: timeout 60 godot --headless --path . --quit-after 120 2>&1 | tee run.log; ! grep -q "SCRIPT ERROR" run.log

  live-prices:
    # Checks the real price sources still answer in the format the app expects.
    # Informational: a failure here does not block the builds.
    needs: test
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: Install Godot
        run: |
          curl -sSL -o godot.zip "$GODOT_URL/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
      - name: Fetch live prices through the app's own code
        run: |
          godot --headless --path . --import || true
          timeout 120 godot --headless --path . res://tests/live_prices.tscn
      - name: Check which sources allow browser requests (CORS)
        run: |
          check() { echo "== $1"; curl -s -o /dev/null -D - -H "Origin: https://clixiogames.github.io" "$2" | grep -i -E "^HTTP|access-control-allow-origin" || true; }
          check CoinGecko "https://api.coingecko.com/api/v3/search?query=bitcoin"
          check Frankfurter "https://api.frankfurter.dev/v1/latest?from=USD&to=EUR"
          check Yahoo "https://query2.finance.yahoo.com/v8/finance/chart/CW8.PA?range=5d&interval=1d"

  web:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Godot and export templates
        run: |
          curl -sSL -o godot.zip "$GODOT_URL/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          curl -sSL -o templates.tpz "$GODOT_URL/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q templates.tpz -d /tmp/tpl
          mv /tmp/tpl/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          rm -rf templates.tpz /tmp/tpl godot.zip
      - name: Export website
        run: |
          godot --headless --path . --import || true
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
          if [ -d docs/site ]; then cp -r docs/site/* build/web/; fi
          touch build/web/.nojekyll
          ls -la build/web
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy-web:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  android:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Godot and export templates
        run: |
          curl -sSL -o godot.zip "$GODOT_URL/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          curl -sSL -o templates.tpz "$GODOT_URL/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q templates.tpz -d /tmp/tpl
          mv /tmp/tpl/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          rm -rf templates.tpz /tmp/tpl godot.zip
      - name: Configure Android SDK for Godot
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "Using Android SDK at $SDK"
          SDKM=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          keytool -genkeypair -v -keystore ~/debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.7.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          timeout 300 godot --headless --path . --import || true
      - name: Export Android test APK (installable directly)
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: android
        run: |
          # Release build (small and fast) signed with a throwaway test key, 64-bit phones only.
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$HOME/debug.keystore"
          mkdir -p build/android
          sed -i "s/^version\/code=.*/version\/code=${GITHUB_RUN_NUMBER}/" export_presets.cfg
          cp export_presets.cfg /tmp/presets_release.cfg
          sed -i 's/^gradle_build\/export_format=1/gradle_build\/export_format=0/; s/^architectures\/armeabi-v7a=true/architectures\/armeabi-v7a=false/' export_presets.cfg
          timeout 1500 godot --headless --path . --install-android-build-template --export-release "Android" build/android/app-finance-test.apk
          cp /tmp/presets_release.cfg export_presets.cfg
          ls -la build/android
      - name: Restore upload key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$HOME/upload.keystore"
            echo "SIGNED=1" >> "$GITHUB_ENV"
          fi
      - name: Export Android release (.aab for Google Play)
        if: env.SIGNED == '1'
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$HOME/upload.keystore"
          timeout 1500 godot --headless --path . --export-release "Android" build/android/app-finance.aab
      - uses: actions/upload-artifact@v5
        with:
          name: android
          path: build/android/
          if-no-files-found: error
      - name: Publish test APK (download link for your phone)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete test-latest -y --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          sleep 5
          gh release create test-latest build/android/app-finance-test.apk -R "$GITHUB_REPOSITORY" \
            --prerelease --target "$GITHUB_SHA" --title "Android test build (latest)" \
            --notes "Automatic test build from $(date -u +%Y-%m-%d) (commit ${GITHUB_SHA::7}). Open this page on your Android phone, tap app-finance-test.apk, and allow installing from your browser when asked."
