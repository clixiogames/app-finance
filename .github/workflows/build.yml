name: Build & test

# Runs on every push and pull request:
#  1. automated tests
#  2. website build (published to GitHub Pages from the main branch)
#  3. Android build (.aab for Google Play + .apk to install directly on a phone)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2
  GODOT_URL: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: |
          curl -sSL -o godot.zip "$GODOT_URL/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
      - name: Import project
        run: godot --headless --path . --import || true
      - name: Run tests
        run: godot --headless --path . --script res://tests/run_tests.gd
      - name: Run end-to-end flow test
        run: timeout 120 godot --headless --path . res://tests/flow_test.tscn
      - name: Check the app starts without errors
        run: timeout 60 godot --headless --path . --quit-after 120 2>&1 | tee run.log; ! grep -q "SCRIPT ERROR" run.log

  export:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Godot and export templates
        run: |
          curl -sSL -o godot.zip "$GODOT_URL/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          curl -sSL -o templates.tpz "$GODOT_URL/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q templates.tpz -d /tmp/tpl
          mv /tmp/tpl/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          rm templates.tpz
      - name: Configure Android SDK for Godot
        run: |
          keytool -genkeypair -v -keystore ~/debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.7.tres <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          godot --headless --path . --import || true
          godot --headless --path . --install-android-build-template || true

      - name: Export website
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: build/web

      - name: Restore upload key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$HOME/upload.keystore"
            echo "SIGNED=1" >> "$GITHUB_ENV"
          fi
      - name: Export Android (release, signed)
        if: env.SIGNED == '1'
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$HOME/upload.keystore"
          mkdir -p build/android
          sed -i "s/^version\/code=.*/version\/code=${GITHUB_RUN_NUMBER}/" export_presets.cfg
          godot --headless --path . --export-release "Android" build/android/app-finance.aab
      - name: Export Android test APK (installable directly)
        run: |
          mkdir -p build/android
          sed -i 's/^gradle_build\/export_format=1/gradle_build\/export_format=0/' export_presets.cfg
          godot --headless --path . --export-debug "Android" build/android/app-finance-test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: build/android/
          if-no-files-found: warn

  deploy-web:
    if: github.ref == 'refs/heads/main'
    needs: export
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
