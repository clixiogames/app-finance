name: Probe data source

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check price providers (format + browser access)
        run: |
          O="Origin: https://clixiogames.github.io"
          show() { echo; echo "===== $1"; curl -s -m 20 -D /tmp/h -H "$O" "$2" -o /tmp/b; grep -i -E "^HTTP|access-control-allow-origin" /tmp/h; head -c 700 /tmp/b; echo; }
          show "EODHD eod demo" "https://eodhd.com/api/eod/AAPL.US?api_token=demo&fmt=json&from=2026-11-10"
          show "EODHD search demo ISIN" "https://eodhd.com/api/search/IE00B4L5Y983?api_token=demo&fmt=json"
          show "EODHD eod demo CW8.PA" "https://eodhd.com/api/eod/CW8.PA?api_token=demo&fmt=json&from=2026-11-10"
          show "AV daily demo" "https://www.alphavantage.co/query?function=TIME_SERIES_DAILY&symbol=IBM&apikey=demo"
          show "AV weekly demo" "https://www.alphavantage.co/query?function=TIME_SERIES_WEEKLY&symbol=IBM&apikey=demo"
          show "AV search demo" "https://www.alphavantage.co/query?function=SYMBOL_SEARCH&keywords=tesco&apikey=demo"
          show "AV bad key" "https://www.alphavantage.co/query?function=TIME_SERIES_DAILY&symbol=EUNL.DEX&apikey=XXXXINVALID"
          echo; echo "===== OpenFIGI preflight"
          curl -s -m 20 -D - -o /dev/null -X OPTIONS -H "$O" -H "Access-Control-Request-Method: POST" -H "Access-Control-Request-Headers: content-type" https://api.openfigi.com/v3/mapping | grep -i -E "^HTTP|access-control"
          echo; echo "===== OpenFIGI mapping ISINs"
          curl -s -m 20 -D /tmp/h -H "$O" -H "Content-Type: application/json" -X POST https://api.openfigi.com/v3/mapping \
            --data '[{"idType":"ID_ISIN","idValue":"IE00B4L5Y983"},{"idType":"ID_ISIN","idValue":"LU1681043599"},{"idType":"ID_ISIN","idValue":"FR0000120271"}]' -o /tmp/b
          grep -i -E "^HTTP|access-control-allow-origin" /tmp/h
          python3 -c "
          import json; d=json.load(open('/tmp/b'))
          for job in d:
              rows=job.get('data',[])
              print(len(rows), sorted(set((r.get('ticker'), r.get('exchCode'), r.get('securityType2'), r.get('marketSector')) for r in rows))[:40])
          "
          echo; echo "===== OpenFIGI search"
          curl -s -m 20 -H "$O" -H "Content-Type: application/json" -X POST https://api.openfigi.com/v3/search --data '{"query":"MSCI WORLD","exchCode":"FP"}' | head -c 900
